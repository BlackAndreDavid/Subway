name: Godot validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.6.3
      SUBWAY_TEST_MODE: "1"
      XDG_DATA_HOME: ${{ github.workspace }}/work/test-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/work/config
      XDG_CACHE_HOME: ${{ github.workspace }}/work/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install art preparation dependency
        run: python3 -m pip install -r requirements-dev.txt
      - name: Download official Godot
        run: |
          mkdir -p work/bin
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o work/godot.zip
          unzip -q work/godot.zip -d work/bin
          mv work/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 work/bin/godot
          chmod +x work/bin/godot
      - name: Rebuild reviewed raster art and synthesized audio
        run: |
          python3 tools/apply_balance.py --data-only
          python3 tools/prepare_art_manifest.py
          python3 tools/generate_room_layouts.py
          python3 tools/generate_audio.py
          work/bin/godot --headless --path . --script tools/import_art.gd
          python3 tools/simplify_art.py --self-test
          python3 tools/simplify_art.py
      - name: Import and check scripts
        run: |
          work/bin/godot --headless --editor --import --quit 2>&1 | tee work/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' work/import.log; then exit 1; fi
      - name: Map properties and gameplay integration
        run: |
          set -o pipefail
          work/bin/godot --headless --path . --script tests/test_runner.gd 2>&1 | tee work/test.log
          if grep -E 'SCRIPT ERROR|ERROR:' work/test.log; then exit 1; fi

      - name: Source acceptance and generated-data consistency
        id: source_acceptance
        run: |
          python3 tests/test_acceptance_gate.py
          python3 tools/audit_project.py --checkpoint --github-output "$GITHUB_OUTPUT"
          git diff --exit-code -- assets/maps/shanghai_metro.json scripts/metro_data.gd scripts/regional_data.gd assets/art/manifest.json scripts/art_manifest.gd scripts/room_layout_data.gd
      - name: Ordinary-input full-floor playthroughs
        if: steps.source_acceptance.outputs.complete == 'true'
        run: |
          set -o pipefail
          timeout 300 work/bin/godot --headless --path . --script tests/playthrough_audit.gd 2>&1 | tee work/play.log
          if grep -E 'SCRIPT ERROR|ERROR:' work/play.log; then exit 1; fi
      - name: Report pending full-game acceptance
        if: steps.source_acceptance.outputs.complete == 'false'
        run: |
          echo "::warning::Development checkpoint: full-game playthrough acceptance is pending. Source, regressions and native rendering are still required."
          echo "### Development checkpoint: full-game acceptance pending" >> "$GITHUB_STEP_SUMMARY"
          echo "This run validates source consistency, gameplay regressions and native rendering. Full playthrough acceptance is explicitly skipped until the registered task is completed." >> "$GITHUB_STEP_SUMMARY"
      - name: Native enemy and projectile rendering under X11
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 90 xvfb-run -a -s "-screen 0 1440x900x24" work/bin/godot --display-driver x11 --audio-driver Dummy --path . --script tests/native_sprite_alignment.gd 2>&1 | tee work/render.log
          if grep -E 'SCRIPT ERROR|ERROR:' work/render.log; then exit 1; fi
          timeout 90 xvfb-run -a -s "-screen 0 1440x900x24" work/bin/godot --display-driver x11 --audio-driver Dummy --path . --script tests/native_bullet_checks.gd 2>&1 | tee work/bullet-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' work/bullet-render.log; then exit 1; fi
          timeout 90 xvfb-run -a -s "-screen 0 1440x900x24" work/bin/godot --display-driver x11 --audio-driver Dummy --path . --script tests/native_shop_checks.gd 2>&1 | tee work/shop-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' work/shop-render.log; then exit 1; fi
